name: LegiSchola Release Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: node scripts/validate-curriculum.mjs
      - run: node scripts/check-academic-guards.mjs
      - run: node scripts/check-social-meta.mjs
      - run: node scripts/check-referral-flow.mjs
      - run: node scripts/check-referral-flow.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ztfjrjviejtxubwvixsf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
