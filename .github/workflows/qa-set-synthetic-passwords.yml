name: QA set synthetic user passwords
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  set-passwords:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: legischola-qa
    env:
      QA_SERVICE_ROLE_KEY: ${{ secrets.LEGISCHOLA_QA_SERVICE_ROLE_KEY }}
      QA_USER_001_PASSWORD: ${{ secrets.LEGISCHOLA_QA_USER_001_PASSWORD }}
      QA_USER_002_PASSWORD: ${{ secrets.LEGISCHOLA_QA_USER_002_PASSWORD }}
    steps:
      - name: Update existing QA-only synthetic users
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,sys
          project='hwhezowlwocqsfpzojnj'
          base=f'https://{project}.supabase.co/auth/v1/admin'
          key=os.getenv('QA_SERVICE_ROLE_KEY','')
          passwords=[os.getenv('QA_USER_001_PASSWORD',''),os.getenv('QA_USER_002_PASSWORD','')]
          if not key or any(len(p)<16 for p in passwords) or passwords[0]==passwords[1]:
              sys.exit('PREREQUISITE: QA service role key and two different passwords of at least 16 characters required')
          for secret in [key,*passwords]: print('::add-mask::'+secret,flush=True)
          def api(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(base+path,data=data,method=method,headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response: return json.load(response)
              except urllib.error.HTTPError as err:
                  sys.exit(f'QA admin API returned HTTP {err.code} during {method} {path.split("?")[0]}')
          expected=[f'legischola-qa-test-{i:03d}@example.invalid' for i in (1,2)]
          found={}
          page=1
          while page<=20:
              result=api('GET',f'/users?page={page}&per_page=1000')
              users=result.get('users',[])
              for u in users:
                  if u.get('email') in expected: found[u['email']]=u['id']
              if len(found)==2 or len(users)<1000: break
              page+=1
          if set(found)!=set(expected): sys.exit('PREREQUISITE: both existing synthetic QA accounts must exist; no accounts modified')
          for email,password in zip(expected,passwords):
              user=api('PUT','/users/'+found[email],{'password':password})
              if user.get('id')!=found[email]: sys.exit('FAIL: user ID mismatch after update')
              print('PASS: password assigned to existing synthetic QA user '+email.split('-')[-1].split('@')[0])
          print('PASS: QA synthetic passwords configured; no passwords printed.')
          PY
