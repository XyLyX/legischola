name: QA programme fixture inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: legischola-qa
    steps:
      - name: Inspect QA programme schema and constraints
        shell: bash
        env:
          QA_DB_URL: ${{ secrets.LEGISCHOLA_QA_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$QA_DB_URL" || { echo "::error::Missing QA connection"; exit 1; }
          echo "::add-mask::$QA_DB_URL"
          psql "$QA_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT column_name,data_type,is_nullable,column_default
          FROM information_schema.columns
          WHERE table_schema='public' AND table_name='programmes'
          ORDER BY ordinal_position;
          SELECT pg_get_constraintdef(k.oid) AS constraint_definition
          FROM pg_constraint k JOIN pg_class c ON c.oid=k.conrelid
          JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname='public' AND c.relname='programmes'
          ORDER BY k.conname;
          SELECT count(*) AS qa_programme_count FROM public.programmes;
          SQL
          echo "PASS: read-only QA programme prerequisite inspection."
